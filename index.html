<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wilker Lima · Engenheiro de software</title>
    <style>
      html { background: #ffffff; }
      #page-loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #ffffff; transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.55s; }
      #page-loader[data-done] { opacity: 0; visibility: hidden; }
      .page-loader-name { font: 720 1.7rem/1 "Mona Sans Variable", "Segoe UI Variable Display", system-ui, sans-serif; letter-spacing: -0.02em; color: #111114; }
      .page-loader-name span { color: #00add8; }
      .page-loader-track { width: 9.5rem; height: 2px; margin: 1.1rem auto 0; border-radius: 2px; background: #ebebef; overflow: hidden; }
      .page-loader-bar { width: 100%; height: 100%; background: #00add8; transform-origin: left center; transform: scaleX(var(--progress, 0.08)); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
      @media (prefers-reduced-motion: reduce) { #page-loader, .page-loader-bar { transition: none; } }
    </style>
  </head>
  <body>
    <div id="page-loader" aria-hidden="true">
      <div>
        <div class="page-loader-name">Wilker Lima<span>.</span></div>
        <div class="page-loader-track"><div class="page-loader-bar"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/app.main.tsx"></script>
  </body>
</html>
